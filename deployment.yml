apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-deployment
spec:
  selector:
    matchLabels:
      app: custom
  replicas: 1 
  template:
    metadata:
      labels:
        app: custom
    spec:
      containers:
      - name: custom
        image: ilyassakhanov/btc-app:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: custom-deployment-service
spec:
  selector:
    app: custom
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30000